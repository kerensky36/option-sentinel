{% extends "base.html" %}

{% block content %}
<div>

  {# ── Toolbar ── #}
  <div class="flex items-center justify-between mb-3">
    <span class="text-gray-400 uppercase tracking-widest text-xs">Positions Dashboard</span>
    <div class="flex items-center gap-3">
      <span id="positions-timestamp" class="text-gray-500 hidden text-xs"></span>
      <button
        id="positions-refresh-btn"
        class="flex items-center gap-1 bg-gray-800 hover:bg-gray-700 text-gray-300 px-2 py-1 transition-colors uppercase tracking-wider text-xs"
        <span>↻</span>
        <span>Refresh</span>
      </button>
    </div>
  </div>

  {# ── Positions table placeholder ── #}
  <div id="positions-table" class="border border-gray-800 bg-gray-900 min-h-24 flex items-center justify-center" style="border-radius:2px; min-height:100px">
    <span class="text-gray-500 text-sm">Loading cached positions…</span>
  </div>

</div>

<script type="module" nonce="{{ csp_nonce }}">
  import './../../static/js/auth.js';
  import './../../static/js/position_cache.js';
  import './../../static/js/positions_ui.js';
</script>
{% endblock %}
