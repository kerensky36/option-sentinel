<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Option Sentinel{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="/static/sentinel.svg">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <script src="https://unpkg.com/htmx-ext-sse@2.2.2/sse.js"></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen">

  <!-- Binary event banner slot -->
  <div id="binary-banner">
    {% block binary_banner %}{% endblock %}
  </div>

  <!-- Nav -->
  <nav class="bg-gray-900 border-b border-gray-800 px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-2.5">
      <img src="/static/sentinel.svg" class="w-9 h-9 drop-shadow-[0_0_6px_rgba(255,34,0,0.5)]" alt="Sentinel">
      <span class="text-lg font-semibold tracking-tight">Option Sentinel</span>
    </div>
    <div class="flex items-center gap-4 text-sm text-gray-400">
      <span id="poll-status">Waiting for data…</span>
    </div>
  </nav>

  <!-- Main content -->
  <main class="max-w-screen-xl mx-auto px-4 py-6">
    {% block content %}{% endblock %}
  </main>

</body>
</html>
